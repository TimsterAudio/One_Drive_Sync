[package]
name = "folder-sync"
version = "0.3.0"
edition = "2021"
description = "Folder Sync: keeps local folders in step with a mounted LAN share"
publish = false

[[bin]]
name = "folder-sync"
path = "src/main.rs"

[dependencies]
one_drive_sync = { path = "..", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
rfd = "0.17"
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
