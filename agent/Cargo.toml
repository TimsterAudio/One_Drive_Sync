[package]
name = "odsync-agent"
version = "0.1.0"
edition = "2021"
description = "Trial OneDrive sync agent: sign in, add folder pairs, sync"
publish = false

[[bin]]
name = "odsync-agent"
path = "src/main.rs"

[dependencies]
one_drive_sync = { path = ".." }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
rfd = "0.17"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
