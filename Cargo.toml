[package]
name = "one_drive_sync"
version = "0.1.0"
edition = "2021"
description = "Folder sync with personal OneDrive over Microsoft Graph, shared by Timster's apps"
authors = ["Timster's Audio Works"]
publish = false

[workspace]
members = ["agent"]

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
notify = "8"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
percent-encoding = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
gethostname = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
