name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy without OneDrive
        run: cargo clippy -p one_drive_sync --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the agent
        run: cargo build --release -p folder-sync
      - uses: actions/upload-artifact@v4
        with:
          name: folder-sync-${{ matrix.os }}
          path: |
            target/release/folder-sync
            target/release/folder-sync.exe
          if-no-files-found: ignore
